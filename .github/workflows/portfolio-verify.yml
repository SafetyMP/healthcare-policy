name: portfolio-verify
on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: portfolio-verify-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Portfolio verify (policy mirror)
        run: |
          chmod +x scripts/*.sh scripts/lib/*.sh 2>/dev/null || true
          ./scripts/verify.sh
